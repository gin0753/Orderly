name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderly_user
          POSTGRES_PASSWORD: orderly_password
          POSTGRES_DB: orderly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U orderly_user -d orderly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NODE_ENV: test

      DATABASE_URL: postgresql://orderly_user:orderly_password@localhost:5432/orderly_test?schema=public
      DIRECT_DATABASE_URL: postgresql://orderly_user:orderly_password@localhost:5432/orderly_test?schema=public
      TEST_DATABASE_URL: postgresql://orderly_user:orderly_password@localhost:5432/orderly_test?schema=public

      WEB_ORIGIN: http://localhost:3000
      API_PORT: "4000"
      ORDERLY_API_ORIGIN: https://ci-api.invalid

      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-for-tests
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-for-tests
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      JWT_REFRESH_TTL_DAYS: "7"

      ADMIN_SEED_EMAIL: admin@orderly.local
      ADMIN_SEED_PASSWORD: ci-admin-password-for-tests-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Verify test PostgreSQL is ready
        run: docker exec "${{ job.services.postgres.id }}" pg_isready -h 127.0.0.1 -U orderly_user -d orderly_test

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:quality

      - name: Build
        run: pnpm build
